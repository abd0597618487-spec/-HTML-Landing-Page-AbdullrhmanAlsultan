
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding and responsive screen settings. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title. -->
    <title>Explore the Mountains</title>

    <!-- Define the CSS styles for the landing page. -->
    <style>

        /* Reset default browser spacing and sizing. */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Set the general page font and colors. */
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            background-color: #111111;
        }

        /* Style the navigation bar at the top of the page. */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 26px 7%;
        }

        /* Style the website logo. */
        .logo {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-decoration: none;
        }

        /* Arrange navigation links horizontally. */
        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        /* Style the navigation links. */
        .nav-links a {
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        /* Change link color when hovering. */
        .nav-links a:hover {
            color: #d7d7d7;
        }

        /* Create the main landing section and display the background image. */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            min-height: 100vh;
            padding: 120px 10%;

            /* Load the image from the same folder as index.html. */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.45)
                ),
                url("./landing.jpg");

            /* Center and cover the entire hero section with the image. */
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Set the width of the main content. */
        .hero-content {
            max-width: 650px;
        }

        /* Style the introductory text. */
        .eyebrow {
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Style the main heading. */
        .hero h1 {
            margin-bottom: 22px;
            font-size: clamp(42px, 7vw, 82px);
            line-height: 1.05;
            text-transform: uppercase;
        }

        /* Style the descriptive paragraph. */
        .hero p {
            max-width: 520px;
            margin-bottom: 32px;
            color: #eeeeee;
            font-size: 17px;
            line-height: 1.7;
        }

        /* Style the Discover More button. */
        .hero-button {
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid #ffffff;
            color: #111111;
            background-color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Change button appearance when hovering. */
        .hero-button:hover {
            color: #ffffff;
            background-color: transparent;
        }

        /* Style the footer at the bottom of the page. */
        .footer {
            position: absolute;
            right: 7%;
            bottom: 25px;
            left: 7%;
            color: #eeeeee;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Make the page responsive on mobile devices. */
        @media (max-width: 600px) {

            /* Adjust the navigation bar for smaller screens. */
            .navbar {
                align-items: flex-start;
                gap: 18px;
                padding: 22px 6%;
            }

            /* Allow navigation links to wrap on mobile. */
            .nav-links {
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 12px;
            }

            /* Reduce navigation link size on mobile. */
            .nav-links a {
                font-size: 12px;
            }

            /* Adjust hero section spacing on mobile. */
            .hero {
                padding: 130px 7% 90px;
            }

            /* Adjust paragraph size on mobile. */
            .hero p {
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- Header section containing the logo and navigation menu. -->
    <header class="navbar">

        <!-- Website logo. -->
        <a class="logo" href="#home">MOUNTAIN</a>

        <!-- Main navigation menu. -->
        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#discover">Discover</a></li>
            </ul>
        </nav>

    </header>

    <!-- Main content of the landing page. -->
    <main>

        <!-- Hero section displaying the mountain background image. -->
        <section class="hero" id="home">

            <!-- Content displayed over the background image. -->
            <div class="hero-content" id="discover">

                <!-- Introductory text above the main heading. -->
                <div class="eyebrow">
                    Discover the beauty of nature
                </div>

                <!-- Main heading of the landing page. -->
                <h1>
                    Explore<br>
                    Beyond Limits
                </h1>

                <!-- Description of the website. -->
                <p>
                    Find inspiration in the quiet beauty of the mountains.
                    Take a moment, enjoy the view, and discover a new adventure.
                </p>

                <!-- Button linking to the About section. -->
                <a class="hero-button" href="#about">
                    DISCOVER MORE
                </a>

            </div>

            <!-- Footer section containing copyright information. -->
            <div class="footer" id="about">
                © 2026 MOUNTAIN. ALL RIGHTS RESERVED.
            </div>

        </section>

    </main>

</body>
</html>
